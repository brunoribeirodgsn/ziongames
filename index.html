<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #E0E0E0;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .card-container {
            aspect-ratio: 3 / 4;
        }
    </style>
</head>

<body class="overflow-hidden">

    <!-- Tela de Loading -->
    <div id="loading-screen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <svg class="animate-spin h-12 w-12 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="mt-4 text-lg font-semibold text-gray-300">Carregando ofertas...</p>
    </div>

    <!-- Estrutura Principal -->
    <div id="app-container" class="flex h-screen opacity-0 transition-opacity duration-500">
        <!-- Menu Lateral -->
        <aside class="w-64 bg-black/30 p-6 flex flex-col">
            <h1 class="text-2xl font-bold text-center text-purple-400 tracking-wider">ZION GAMES</h1>
            <nav class="mt-12 flex flex-col space-y-2">
                <a href="#" data-platform="steam" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-800 transition-colors bg-gray-800 text-white">
                    <i data-lucide="gamepad" class="w-5 h-5 mr-3"></i> Steam
                </a>
                <a href="#" data-platform="epic" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="gamepad-2" class="w-5 h-5 mr-3"></i> Epic Games
                </a>
                <a href="#" data-platform="xbox" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="gamepad-2" class="w-5 h-5 mr-3"></i> Xbox
                </a>
                <a href="#" data-platform="psn" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="monitor" class="w-5 h-5 mr-3"></i> PSN
                </a>
                <hr class="border-gray-700 my-4">
                <a href="#" data-platform="descobrir" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="compass" class="w-5 h-5 mr-3"></i> Descobrir
                </a>
                <a href="#" data-platform="promocoes" class="nav-link flex items-center p-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="tag" class="w-5 h-5 mr-3"></i> Promoções
                </a>
            </nav>
            <div class="mt-auto text-center text-xs text-gray-500">
                <p>Desenvolvido por © Bruno Ribeiro</p>
                <p>Versão 1.0.0</p>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex items-center mb-6">
                <h2 id="platform-title" class="text-3xl font-bold uppercase tracking-wide">Steam</h2>
                <i data-lucide="chevron-right" class="w-8 h-8 ml-2 text-gray-500"></i>
            </header>
            
            <!-- Conteúdo da Grade de Jogos -->
            <div id="games-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6 py-4">
                <!-- Cards de jogos serão inseridos aqui pelo JavaScript -->
            </div>
        </main>
    </div>
    
    <!-- Modal de Detalhes do Jogo -->
    <div id="game-modal" class="fixed inset-0 bg-black/80 z-40 flex items-center justify-center p-4 hidden">
        <div id="modal-content" class="bg-[#181818] rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col md:flex-row overflow-hidden">
            <!-- Conteúdo do Modal será inserido aqui pelo JavaScript -->
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingScreen = document.getElementById('loading-screen');
            const appContainer = document.getElementById('app-container');
            const navLinks = document.querySelectorAll('.nav-link');
            const gamesContainer = document.getElementById('games-container');
            const platformTitle = document.getElementById('platform-title');
            const gameModal = document.getElementById('game-modal');
            const modalContent = document.getElementById('modal-content');

            const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') 
                ? 'http://localhost:3000' 
                : ''; // Relative in production (Vercel)

            // --- FUNÇÕES DA APLICAÇÃO ---

            // Busca os jogos da API e renderiza
            async function fetchGames(platform) {
                showSpinner();
                try {
                    const response = await fetch(`${API_BASE_URL}/api/games/${platform}`);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const games = await response.json();
                    renderGames(games, platform);
                } catch (error) {
                    console.error('Falha ao buscar jogos:', error);
                    renderError(platform);
                }
            }

            // Exibe um spinner de carregamento no container de jogos
            function showSpinner() {
                gamesContainer.innerHTML = `
                    <div class="col-span-full h-96 flex items-center justify-center">
                        <svg class="animate-spin h-10 w-10 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                `;
            }

            // Renderiza os cards dos jogos na tela
            function renderGames(games, platform) {
                if (!games || games.length === 0) {
                    renderError(platform);
                    return;
                }

                gamesContainer.innerHTML = ''; // Limpa o container
                games.forEach(game => {
                    const isFree = game.price === 'Gratuito' || game.price === 'Free' || game.price === '0,00';
                    const hasDiscount = game.discount && game.discount !== '0%';
                    
                    const gameCard = document.createElement('div');
                    gameCard.className = 'game-card cursor-pointer group relative';
                    gameCard.innerHTML = `
                        <div class="card-container bg-gray-800 rounded-lg overflow-hidden transition-all duration-300 group-hover:scale-[1.02] group-hover:shadow-2xl group-hover:shadow-purple-500/30">
                            <img src="${game.imageUrl}" alt="${game.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/300x400/181818/purple?text=Sem+Imagem'">
                            
                            <!-- Badges -->
                            <div class="absolute top-2 right-2 flex flex-col gap-1">
                                ${isFree ? '<span class="bg-green-500 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase shadow-lg">Grátis</span>' : ''}
                                ${hasDiscount ? `<span class="bg-purple-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-lg">${game.discount}</span>` : ''}
                            </div>
                        </div>
                        <div class="mt-3 px-1">
                            <h3 class="font-medium text-gray-200 truncate text-sm group-hover:text-purple-400 transition-colors">${game.title}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <p class="text-sm ${isFree ? 'text-green-400' : 'text-white'} font-bold">
                                    ${game.price}
                                </p>
                                ${game.originalPrice ? `<p class="text-[10px] text-gray-500 line-through mt-0.5">${game.originalPrice}</p>` : ''}
                            </div>
                            <p class="text-[10px] text-gray-500 uppercase tracking-tighter mt-0.5">${game.platform || platform}</p>
                        </div>
                    `;
                    gameCard.addEventListener('click', () => openGameModal(game));
                    gamesContainer.appendChild(gameCard);
                });
            }
            
            // Renderiza mensagem de erro
            function renderError(platform) {
                gamesContainer.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500">Nenhum jogo encontrado para ${platform}. <br> Tente novamente mais tarde.</div>`;
            }

            // Abre o modal com os detalhes do jogo
            function openGameModal(game) {
                const isFree = game.price === 'Gratuito' || game.price === 'Free';
                modalContent.innerHTML = `
                    <div class="md:w-1/2 h-64 md:h-auto overflow-hidden">
                        <img src="${game.imageUrl}" alt="${game.title}" class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-700">
                    </div>
                    <div class="md:w-1/2 p-8 flex flex-col bg-gradient-to-br from-[#181818] to-[#121212]">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-[10px] uppercase font-bold tracking-widest text-purple-500">${game.platform}</span>
                        </div>
                        <h2 class="text-3xl font-bold text-white mb-2 leading-tight">${game.title}</h2>
                        
                        <div class="flex items-center gap-4 mb-6">
                            <div class="flex flex-col">
                                ${game.originalPrice ? `<span class="text-sm text-gray-500 line-through">${game.originalPrice}</span>` : ''}
                                <span class="text-3xl font-black ${isFree ? 'text-green-400' : 'text-white'}">${game.price}</span>
                            </div>
                            ${game.discount ? `<span class="bg-purple-600 text-white px-3 py-1 rounded-lg font-bold text-xl h-fit">-${game.discount.replace('-', '')}</span>` : ''}
                        </div>
                        
                        <div class="space-y-4 text-gray-400 text-sm leading-relaxed mb-8">
                            <p>Aproveite esta oferta direto na loja oficial da plataforma. Os preços e a disponibilidade podem variar conforme a região.</p>
                        </div>

                        <a href="${game.storeUrl}" target="_blank" class="w-full group bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-xl transition-all duration-300 flex items-center justify-center gap-3 shadow-lg shadow-purple-600/20 active:scale-[0.98]">
                            Resgatar na Loja 
                            <i data-lucide="external-link" class="w-5 h-5 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                        </a>
                    </div>
                `;
                gameModal.classList.remove('hidden');
                lucide.createIcons();
            }

            // Fecha o modal
            gameModal.addEventListener('click', (e) => {
                if (e.target === gameModal) {
                    gameModal.classList.add('hidden');
                }
            });

            // Gerencia a navegação
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const platform = link.dataset.platform;

                    // Atualiza o estado ativo do menu
                    navLinks.forEach(l => l.classList.remove('bg-gray-800', 'text-white', 'border-l-2', 'border-purple-500'));
                    link.classList.add('bg-gray-800', 'text-white', 'border-l-2', 'border-purple-500');

                    // Atualiza o título e busca os jogos
                    platformTitle.textContent = platform === 'promocoes' ? 'Promoções' : platform;
                    fetchGames(platform);
                });
            });


            // --- INICIALIZAÇÃO DA APLICAÇÃO ---
            setTimeout(() => {
                lucide.createIcons();
                // Mostra a aplicação e esconde a tela de loading
                loadingScreen.style.opacity = '0';
                appContainer.style.opacity = '1';
                setTimeout(() => loadingScreen.style.display = 'none', 500);

                // Ativa o primeiro link
                const initialLink = document.querySelector('[data-platform="steam"]');
                if (initialLink) {
                    initialLink.classList.add('bg-gray-800', 'text-white', 'border-l-2', 'border-purple-500');
                    platformTitle.textContent = 'Steam';
                    fetchGames('steam');
                }
            }, 800);
        });
    </script>
</body>
</html>
